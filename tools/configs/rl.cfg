# Console run of Rocket League (no EAC: RocketLeague.exe directly), as on the laptop with
# tools/run-rl.sh. tools/console-rl.ps1 appends the Epic login arguments (a fresh exchange
# code from the Epic Games Launcher) as further argv= lines and uploads the result as
# LocalState\launch.cfg; this template alone starts RL without a login.
probe=quick
# under the measured ~4.5 GiB commit ceiling, leaving room for the host and the GPU driver;
# the layer's swap (TEMP) takes the rest of what Rocket League touches
mem_budget_mb=3584
# the game ships in the package's install folder (registered as loose files: tools/console-loose.ps1),
# not in LocalState, whose data area is too small for it (and holds TEMP: the layer's swap)
mount=/game=pkg:game
# the console's video output: the largest mode up to 2560x1440, then the highest refresh up to 120 Hz
# (or display=<w>x<h>@<hz>); Rocket League's resolution list goes up to it
display=auto
# native D3D11 device instead of D3D11On12 (laptop: render thread ~34% -> ~20% CPU); delete this line
# to go back to D3D11On12, no rebuild needed
host_env=XRL_D3D11=native
argv=/usr/lib/wine/x86_64-unix/wine64
argv=Z:\game\Binaries\Win64\RocketLeague.exe
env=WINEPREFIX=/prefix
env=WINEARCH=win64
env=USER=steamuser
env=HOME=/home/steamuser
env=PATH=/usr/bin:/bin
env=XRL_HOST_USD=1
env=XRL_NO_SPAWN=1
env=XRL_SKIP_WINEBOOT=1
# warn+seh: Rocket League's own log lines (OutputDebugString) land in log.txt
env=WINEDEBUG=err+all,warn+seh
env=WINEDLLOVERRIDES=winemenubuilder.exe=d
