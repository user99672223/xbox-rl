# Console run of the layer's own test guest (layer/tests/guest/guest.c) through the
# real layer in the full host, with the real gfx library. No Wine involved.
# Push:  pwsh tools/push-file.ps1 -Local layer/tests/guest/out/guest.elf -Remote rootfs/bin
#        copy this file to launch.cfg, then pwsh tools/push-file.ps1 -Local launch.cfg
probe=quick
# committed-memory budget for the guest: under the measured ~4.5 GiB commit ceiling,
# leaving room for the host process and the GPU driver
mem_budget_mb=3584
argv=/bin/guest.elf
env=HOME=/home/xbox
env=PATH=/usr/bin:/bin
