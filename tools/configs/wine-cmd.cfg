# Console run: Wine's cmd.exe through the layer (first Windows program on the Xbox).
# Guest tree: wine/scripts/stage-rootfs.sh, pushed with
#   pwsh tools/push-game.ps1 -Source <staged dir> -Dest rootfs -Yes
# then copy this file to launch.cfg and: pwsh tools/push-file.ps1 -Local launch.cfg
probe=quick
mem_budget_mb=3584
argv=/usr/lib/wine/x86_64-unix/wine64
argv=C:\windows\system32\cmd.exe
argv=/c
argv=ver
env=WINEPREFIX=/prefix
env=WINEARCH=win64
env=USER=steamuser
env=HOME=/home/steamuser
env=XRL_HOST_USD=1
env=XRL_NO_SPAWN=1
env=XRL_SKIP_WINEBOOT=1
env=WINEDEBUG=err+all
env=WINEDLLOVERRIDES=winemenubuilder.exe=d
