<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- xbox-rl Night: the default wallpaper of the xbox-rl desktop (desktop/plasma). Dark, low-contrast, so a dock and
       windows read well on a TV; green and teal light from two corners, a few soft ribbons. MIT, made for the project. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0a1a1c"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="green" cx="0.18" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#2eb35a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1c7a44" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.86" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#1fa3b8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#16606e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3ddc84" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#2bc0d6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2bc0d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#green)"/>
  <rect width="3840" height="2160" fill="url(#teal)"/>
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round" filter="url(#soft)">
    <path d="M -200 1900 C 900 1500, 1700 1750, 2500 1050 S 3700 300, 4100 200" stroke-width="160"/>
    <path d="M -200 2050 C 1000 1700, 1900 1900, 2700 1250 S 3800 520, 4100 430" stroke-width="60" opacity="0.8"/>
  </g>
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M -200 1960 C 950 1600, 1800 1820, 2600 1150 S 3750 410, 4100 315" stroke-width="3" opacity="0.9"/>
    <path d="M -200 1820 C 850 1420, 1650 1680, 2420 980 S 3650 230, 4100 120" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
